<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 5: Magnetic Trails</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #030304;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }
  .overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 5rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  h1 span {
    background: linear-gradient(to right, #F7931A, #FFD600);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-family: 'JetBrains Mono', monospace;
    color: #94A3B8;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .label {
    position: fixed;
    top: 24px; left: 24px;
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 12px 20px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #F7931A;
    letter-spacing: 0.1em;
  }
  .desc {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 16px 28px;
    border-radius: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: #94A3B8;
    text-align: center;
    max-width: 540px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <h1>Soham <span>Dandekar</span></h1>
  <p>Move your mouse around</p>
</div>
<div class="label">05 — MAGNETIC TRAILS</div>
<div class="desc">
  Your cursor leaves behind a trail of glowing embers that fade out like sparks from a forge. The trail follows smooth curves with a slight delay, creating a calligraphic, flowing ribbon of light that decays into the void.
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: -9999, y: -9999 };
const TRAIL_LENGTH = 80;
const trail = [];

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

// Ember particles
const embers = [];

class Ember {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 2;
    this.vy = (Math.random() - 0.5) * 2 - 1; // drift up
    this.life = 1;
    this.decay = Math.random() * 0.02 + 0.01;
    this.size = Math.random() * 2.5 + 0.5;
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vy -= 0.01; // float up
    this.vx *= 0.99;
    this.life -= this.decay;
  }
  draw() {
    if (this.life <= 0) return;
    const alpha = this.life;
    // Orange to gold to dim
    const r = 247;
    const g = 147 + (1 - this.life) * 67; // shift toward gold
    const b = 26;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
    // Glow
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size * this.life * 3, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha * 0.15})`;
    ctx.fill();
  }
}

let frameCount = 0;
function animate() {
  frameCount++;
  // Fade effect instead of clear
  ctx.fillStyle = 'rgba(3, 3, 4, 0.12)';
  ctx.fillRect(0, 0, W, H);

  // Update trail
  if (mouse.x > 0) {
    trail.unshift({ x: mouse.x, y: mouse.y });
    if (trail.length > TRAIL_LENGTH) trail.pop();

    // Spawn embers occasionally
    if (frameCount % 3 === 0 && trail.length > 2) {
      const idx = Math.floor(Math.random() * Math.min(trail.length, 10));
      embers.push(new Ember(trail[idx].x, trail[idx].y));
    }
  }

  // Draw trail as gradient ribbon
  if (trail.length > 2) {
    for (let i = 1; i < trail.length - 1; i++) {
      const t = i / trail.length;
      const alpha = (1 - t) * 0.8;
      const width = (1 - t) * 6 + 1;
      
      ctx.beginPath();
      ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
      
      // Use quadratic curve for smoothness
      const cpx = trail[i].x;
      const cpy = trail[i].y;
      const endx = (trail[i].x + trail[i + 1].x) / 2;
      const endy = (trail[i].y + trail[i + 1].y) / 2;
      ctx.quadraticCurveTo(cpx, cpy, endx, endy);
      
      // Gradient from orange to gold
      const r = 247;
      const g = 147 + t * 67;
      const b = 26;
      ctx.strokeStyle = `rgba(${r},${g},${b},${alpha})`;
      ctx.lineWidth = width;
      ctx.lineCap = 'round';
      ctx.stroke();
    }

    // Leading bright point
    if (trail.length > 0) {
      ctx.beginPath();
      ctx.arc(trail[0].x, trail[0].y, 4, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 214, 0, 0.9)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(trail[0].x, trail[0].y, 12, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 214, 0, 0.15)';
      ctx.fill();
    }
  }

  // Update and draw embers
  for (let i = embers.length - 1; i >= 0; i--) {
    embers[i].update();
    embers[i].draw();
    if (embers[i].life <= 0) embers.splice(i, 1);
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
