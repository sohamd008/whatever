<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 4: Radial Pulse Spotlight</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #030304;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }
  .overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 5rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  h1 span {
    background: linear-gradient(to right, #F7931A, #FFD600);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-family: 'JetBrains Mono', monospace;
    color: #94A3B8;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .label {
    position: fixed;
    top: 24px; left: 24px;
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 12px 20px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #F7931A;
    letter-spacing: 0.1em;
  }
  .desc {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 16px 28px;
    border-radius: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: #94A3B8;
    text-align: center;
    max-width: 540px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <h1>Soham <span>Dandekar</span></h1>
  <p>Move your mouse around</p>
</div>
<div class="label">04 — RADIAL PULSE SPOTLIGHT</div>
<div class="desc">
  A warm radial spotlight follows your cursor, revealing a hidden blockchain grid underneath. Concentric pulse rings emanate from your cursor position, expanding outward like sonar waves.
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: W / 2 || 500, y: H / 2 || 400 };
let smoothMouse = { x: mouse.x, y: mouse.y };
const CELL = 50;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  mouse.x = W / 2;
  mouse.y = H / 2;
  smoothMouse.x = mouse.x;
  smoothMouse.y = mouse.y;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });

// Pulse rings
const pulses = [];
let lastPulseTime = 0;

function addPulse() {
  pulses.push({
    x: smoothMouse.x,
    y: smoothMouse.y,
    radius: 0,
    maxRadius: 350,
    opacity: 0.4,
    speed: 2.5
  });
}

let time = 0;
function animate() {
  time++;
  ctx.clearRect(0, 0, W, H);

  // Smooth mouse
  smoothMouse.x += (mouse.x - smoothMouse.x) * 0.08;
  smoothMouse.y += (mouse.y - smoothMouse.y) * 0.08;

  // Add pulse every 60 frames
  if (time - lastPulseTime > 50) {
    addPulse();
    lastPulseTime = time;
  }

  // Draw hidden grid revealed by spotlight
  const revealRadius = 280;
  const cols = Math.ceil(W / CELL) + 1;
  const rows = Math.ceil(H / CELL) + 1;

  for (let c = 0; c <= cols; c++) {
    for (let r = 0; r <= rows; r++) {
      const x = c * CELL;
      const y = r * CELL;
      const dx = x - smoothMouse.x;
      const dy = y - smoothMouse.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      
      if (dist < revealRadius) {
        const factor = Math.pow(1 - dist / revealRadius, 2);
        
        // Vertical line segment
        if (r < rows) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x, y + CELL);
          ctx.strokeStyle = `rgba(30, 41, 59, ${factor * 0.6})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
        
        // Horizontal line segment
        if (c < cols) {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + CELL, y);
          ctx.strokeStyle = `rgba(30, 41, 59, ${factor * 0.6})`;
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }

        // Intersection dot
        if (factor > 0.1) {
          ctx.beginPath();
          ctx.arc(x, y, 1 + factor * 2, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(247, 147, 26, ${factor * 0.5})`;
          ctx.fill();
        }
      }
    }
  }

  // Draw pulse rings
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i];
    p.radius += p.speed;
    p.opacity = 0.4 * (1 - p.radius / p.maxRadius);
    
    if (p.radius >= p.maxRadius) {
      pulses.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(247, 147, 26, ${p.opacity})`;
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Inner glow ring
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255, 214, 0, ${p.opacity * 0.3})`;
    ctx.lineWidth = 4;
    ctx.stroke();
  }

  // Main spotlight glow
  const gradient = ctx.createRadialGradient(
    smoothMouse.x, smoothMouse.y, 0,
    smoothMouse.x, smoothMouse.y, revealRadius
  );
  gradient.addColorStop(0, 'rgba(247, 147, 26, 0.08)');
  gradient.addColorStop(0.5, 'rgba(234, 88, 12, 0.03)');
  gradient.addColorStop(1, 'rgba(247, 147, 26, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);

  // Center bright dot
  ctx.beginPath();
  ctx.arc(smoothMouse.x, smoothMouse.y, 3, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 214, 0, 0.6)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(smoothMouse.x, smoothMouse.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 214, 0, 0.1)';
  ctx.fill();

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
