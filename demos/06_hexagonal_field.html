<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 6: Hexagonal Energy Field</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #030304;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }
  .overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 5rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  h1 span {
    background: linear-gradient(to right, #F7931A, #FFD600);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-family: 'JetBrains Mono', monospace;
    color: #94A3B8;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .label {
    position: fixed;
    top: 24px; left: 24px;
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 12px 20px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #F7931A;
    letter-spacing: 0.1em;
  }
  .desc {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 16px 28px;
    border-radius: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: #94A3B8;
    text-align: center;
    max-width: 540px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <h1>Soham <span>Dandekar</span></h1>
  <p>Move your mouse around</p>
</div>
<div class="label">06 — HEXAGONAL ENERGY FIELD</div>
<div class="desc">
  A honeycomb hexagonal grid covers the void. As your cursor passes over each cell, it ignites with orange energy that slowly fades out — like activating nodes in a blockchain network. Creates a "heatmap trail" effect.
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: -9999, y: -9999 };
const HEX_SIZE = 28;
const ACTIVATE_RADIUS = 160;
let hexGrid = [];

function hexCorner(cx, cy, size, i) {
  const angle = (Math.PI / 180) * (60 * i - 30);
  return {
    x: cx + size * Math.cos(angle),
    y: cy + size * Math.sin(angle)
  };
}

function buildGrid() {
  hexGrid = [];
  const w = HEX_SIZE * 2;
  const h = Math.sqrt(3) * HEX_SIZE;
  const cols = Math.ceil(W / (w * 0.75)) + 2;
  const rows = Math.ceil(H / h) + 2;
  
  for (let c = -1; c < cols; c++) {
    for (let r = -1; r < rows; r++) {
      const x = c * w * 0.75;
      const y = r * h + (c % 2 ? h / 2 : 0);
      hexGrid.push({
        x, y,
        energy: 0,      // current glow level
        targetEnergy: 0  // target glow level
      });
    }
  }
}

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  buildGrid();
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

function drawHex(cx, cy, size) {
  ctx.beginPath();
  for (let i = 0; i < 6; i++) {
    const corner = hexCorner(cx, cy, size, i);
    if (i === 0) ctx.moveTo(corner.x, corner.y);
    else ctx.lineTo(corner.x, corner.y);
  }
  ctx.closePath();
}

function animate() {
  ctx.clearRect(0, 0, W, H);

  hexGrid.forEach(hex => {
    const dx = hex.x - mouse.x;
    const dy = hex.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    
    if (dist < ACTIVATE_RADIUS) {
      const factor = Math.pow(1 - dist / ACTIVATE_RADIUS, 2);
      hex.targetEnergy = Math.max(hex.targetEnergy, factor);
    }
    
    // Smooth energy transition
    hex.energy += (hex.targetEnergy - hex.energy) * 0.15;
    // Decay target
    hex.targetEnergy *= 0.985;
    
    if (hex.energy < 0.005) {
      hex.energy = 0;
      return;
    }

    const e = hex.energy;

    // Fill with energy color
    drawHex(hex.x, hex.y, HEX_SIZE - 2);
    const r = Math.round(234 + e * 13);
    const g = Math.round(88 + e * 59);
    const b = Math.round(12 + e * 14);
    ctx.fillStyle = `rgba(${r},${g},${b},${e * 0.15})`;
    ctx.fill();

    // Border glow
    drawHex(hex.x, hex.y, HEX_SIZE - 2);
    ctx.strokeStyle = `rgba(247, 147, 26, ${e * 0.6})`;
    ctx.lineWidth = 0.8;
    ctx.stroke();

    // Center dot
    if (e > 0.2) {
      ctx.beginPath();
      ctx.arc(hex.x, hex.y, 1.5 + e * 2, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255, 214, 0, ${e * 0.7})`;
      ctx.fill();
    }
  });

  // Draw base grid (very subtle)
  hexGrid.forEach(hex => {
    if (hex.energy > 0.01) return; // already drawn with glow
    drawHex(hex.x, hex.y, HEX_SIZE - 2);
    ctx.strokeStyle = 'rgba(30, 41, 59, 0.15)';
    ctx.lineWidth = 0.3;
    ctx.stroke();
  });

  // Mouse ambient glow
  if (mouse.x > 0) {
    const gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, ACTIVATE_RADIUS);
    gradient.addColorStop(0, 'rgba(247, 147, 26, 0.04)');
    gradient.addColorStop(1, 'rgba(247, 147, 26, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);
  }

  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
