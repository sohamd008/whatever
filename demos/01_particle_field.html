<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo 1: Particle Field</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #030304;
    color: #fff;
    font-family: 'Space Grotesk', sans-serif;
    overflow: hidden;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    z-index: 0;
  }
  .overlay {
    position: relative;
    z-index: 1;
    text-align: center;
    pointer-events: none;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 5rem);
    font-weight: 700;
    margin-bottom: 0.5rem;
  }
  h1 span {
    background: linear-gradient(to right, #F7931A, #FFD600);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    font-family: 'JetBrains Mono', monospace;
    color: #94A3B8;
    font-size: 0.9rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }
  .label {
    position: fixed;
    top: 24px; left: 24px;
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 12px 20px;
    border-radius: 999px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: #F7931A;
    letter-spacing: 0.1em;
  }
  .desc {
    position: fixed;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    z-index: 10;
    background: rgba(15,17,21,0.8);
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    padding: 16px 28px;
    border-radius: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: #94A3B8;
    text-align: center;
    max-width: 500px;
    line-height: 1.6;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="overlay">
  <h1>Soham <span>Dandekar</span></h1>
  <p>Move your mouse around</p>
</div>
<div class="label">01 — PARTICLE FIELD</div>
<div class="desc">
  Particles float organically and react to your cursor. Nearby particles connect with glowing orange lines. Cursor pushes particles away creating a force-field effect.
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
let mouse = { x: -9999, y: -9999 };
const PARTICLE_COUNT = 120;
const CONNECTION_DIST = 150;
const MOUSE_RADIUS = 180;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('mouseleave', () => { mouse.x = -9999; mouse.y = -9999; });

class Particle {
  constructor() {
    this.x = Math.random() * W;
    this.y = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 0.6;
    this.vy = (Math.random() - 0.5) * 0.6;
    this.r = Math.random() * 2 + 0.5;
  }
  update() {
    // Mouse repulsion
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < MOUSE_RADIUS && dist > 0) {
      const force = (MOUSE_RADIUS - dist) / MOUSE_RADIUS;
      this.vx += (dx / dist) * force * 0.8;
      this.vy += (dy / dist) * force * 0.8;
    }
    this.vx *= 0.97;
    this.vy *= 0.97;
    this.x += this.vx;
    this.y += this.vy;
    if (this.x < 0) this.x = W;
    if (this.x > W) this.x = 0;
    if (this.y < 0) this.y = H;
    if (this.y > H) this.y = 0;
  }
  draw() {
    const dx = this.x - mouse.x;
    const dy = this.y - mouse.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    const proximity = Math.max(0, 1 - dist / (MOUSE_RADIUS * 2));
    const r = 247, g = 147, b = 26;
    const alpha = 0.3 + proximity * 0.7;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.r + proximity * 2, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(${r},${g},${b},${alpha})`;
    ctx.fill();
    if (proximity > 0.2) {
      ctx.beginPath();
      ctx.arc(this.x, this.y, this.r + proximity * 6, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${r},${g},${b},${proximity * 0.15})`;
      ctx.fill();
    }
  }
}

const particles = Array.from({ length: PARTICLE_COUNT }, () => new Particle());

function drawConnections() {
  for (let i = 0; i < particles.length; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const dx = particles[i].x - particles[j].x;
      const dy = particles[i].y - particles[j].y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < CONNECTION_DIST) {
        const alpha = (1 - dist / CONNECTION_DIST) * 0.25;
        ctx.beginPath();
        ctx.moveTo(particles[i].x, particles[i].y);
        ctx.lineTo(particles[j].x, particles[j].y);
        ctx.strokeStyle = `rgba(247, 147, 26, ${alpha})`;
        ctx.lineWidth = 0.5;
        ctx.stroke();
      }
    }
  }
}

function animate() {
  ctx.clearRect(0, 0, W, H);
  particles.forEach(p => { p.update(); p.draw(); });
  drawConnections();
  requestAnimationFrame(animate);
}
animate();
</script>
</body>
</html>
