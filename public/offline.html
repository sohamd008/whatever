<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | soham.eu.cc</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #030304;
        --panel: rgba(15, 17, 21, 0.9);
        --border: rgba(255, 255, 255, 0.08);
        --text: #ffffff;
        --muted: #cbd5e1;
        --accent: #f7931a;
        --accent-2: #ffd600;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(247, 147, 26, 0.2), transparent 40%),
          radial-gradient(circle at bottom right, rgba(255, 214, 0, 0.12), transparent 30%),
          var(--bg);
        color: var(--text);
        font-family: "Segoe UI", Arial, sans-serif;
      }

      main {
        width: min(100%, 760px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--panel);
        backdrop-filter: blur(14px);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 16px;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(247, 147, 26, 0.12);
        color: var(--accent);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.24em;
        text-transform: uppercase;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: var(--accent);
        box-shadow: 0 0 20px rgba(247, 147, 26, 0.6);
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 6vw, 4rem);
        line-height: 0.95;
      }

      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
        max-width: 55ch;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin-top: 28px;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 48px;
        padding: 0 22px;
        border-radius: 999px;
        text-decoration: none;
        color: var(--text);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        border: 1px solid var(--border);
      }

      a.primary {
        background: linear-gradient(90deg, #ea580c, #f7931a);
        border-color: transparent;
        color: #030304;
      }

      a.secondary:hover {
        border-color: rgba(255, 255, 255, 0.22);
      }
    </style>
  </head>
  <body>
    <main>
      <div class="eyebrow"><span class="dot"></span>Offline Mode</div>
      <h1>Still here,<br>just offline.</h1>
      <p>The cached shell of soham.eu.cc is available, but the page you requested needs a network connection. You can still jump back to the portfolio, tools, or arcade while the connection comes back.</p>
      <div class="actions">
        <a class="primary" href="/">Home</a>
        <a class="secondary" href="/toolbox">Toolbox</a>
        <a class="secondary" href="/games">Arcade</a>
      </div>
    </main>
  </body>
</html>
